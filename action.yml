name: 'Nexus Shield Action Verifier'
description: 'Intercepts AI agent tool calls, enforces governance policies, and generates SHA-256 Universal Action Receipts (UAR).'
author: 'Nexus Shield'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  agent_intent:
    description: 'The natural language or parsed intent of the AI agent'
    required: true
  tool_call_payload:
    description: 'JSON payload representing the tool name and arguments'
    required: true
  policy_endpoint:
    description: 'Nexus Shield control plane or air-gapped engine URL'
    required: false
    default: 'http://localhost:8090'
  feedback:
    description: 'Optional learning hint — set to false_positive when a block was incorrect'
    required: false
    default: ''
  rollback:
    description: 'When true, rollback policy.yml to the last stable UAR snapshot instead of verifying'
    required: false
    default: 'false'

outputs:
  uar_receipt_id:
    description: 'The cryptographic SHA-256 receipt ID generated for the action'
    value: ${{ steps.nexus_verify.outputs.uar_receipt_id }}
  verification_status:
    description: 'Passed, Blocked, or Requires Approval'
    value: ${{ steps.nexus_verify.outputs.verification_status }}

runs:
  using: 'composite'
  steps:
    - name: Verify agent action and seal UAR
      id: nexus_verify
      shell: bash
      env:
        INPUT_AGENT_INTENT: ${{ inputs.agent_intent }}
        INPUT_TOOL_CALL_PAYLOAD: ${{ inputs.tool_call_payload }}
        INPUT_POLICY_ENDPOINT: ${{ inputs.policy_endpoint }}
        INPUT_FEEDBACK: ${{ inputs.feedback }}
        INPUT_ROLLBACK: ${{ inputs.rollback }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 -m pip install -q pyyaml
        python3 "${{ github.action_path }}/.github/actions/verify/verify.py"
