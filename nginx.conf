worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    upstream nexus_api {
        server nexus-api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # --- Nexus Quantum Guard API (doğrudan proxy) ---
        location /v1/shield {
            proxy_pass         http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
        }

        location /v1/shield/validate-chat {
            proxy_pass         http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
        }

        location /healthz {
            proxy_pass http://nexus_api/healthz;
            access_log off;
        }

        location /metrics {
            proxy_pass http://nexus_api/metrics;
            access_log off;
        }

        # --- Varsayılan: API köküne yönlendir ---
        location / {
            proxy_pass         http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Connection        "";
        }

        error_page 403 = @security_block;

        location @security_block {
            default_type application/json;
            return 403 '{"status":"REJECTED","reason":"Security Policy Violation - Nexus Quantum Guard","error_code":403}';
        }
    }
}
