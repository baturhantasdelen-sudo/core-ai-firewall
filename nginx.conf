worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Docker embedded DNS — re-resolve upstream container names after restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Early-Exit Fast Guardrail (nexus_shield_fast_api.py)
    upstream nexus_shield_fast {
        zone nexus_shield_fast 64k;
        server nexus-shield-api-prod:8080 resolve;
        keepalive 32;
    }

    # Legacy ML pipeline (deep semantic scan)
    upstream nexus_ml_api {
        zone nexus_ml_api 64k;
        server nexus-api-prod:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        set_real_ip_from 172.16.0.0/12;
        real_ip_header CF-Connecting-IP;

        # ── FastAPI / ML API routes (must precede Vercel catch-all) ───────────

        location /v1/shield/validate-chat {
            proxy_pass         http://nexus_ml_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /v1/shield {
            proxy_pass         http://nexus_shield_fast;
            proxy_intercept_errors off;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Public playground + Vercel /api/sandbox proxy target (no API key)
        location /api/sandbox {
            proxy_pass         http://nexus_shield_fast;
            proxy_intercept_errors off;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /ws/analytics {
            proxy_pass         http://nexus_shield_fast;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 86400s;
        }

        location /healthz {
            proxy_pass http://nexus_shield_fast/healthz;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            access_log off;
        }

        location /api/v1/health {
            proxy_pass http://nexus_shield_fast/api/v1/health;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            access_log off;
        }

        location /metrics {
            proxy_pass http://nexus_ml_api/metrics;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # ── Next.js All-in-One app (Vercel) — landing, dashboard, Stripe, etc. ─

        location / {
            proxy_pass https://nexus-shield-dashboard.vercel.app;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host nexus-shield-dashboard.vercel.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 15s;
        }

        error_page 403 = @security_block;

        location @security_block {
            default_type application/json;
            return 403 '{"detail":"Blocked by Nexus Shield Early Exit Engine (Prompt Injection Detected)","status_code":403}';
        }
    }
}
