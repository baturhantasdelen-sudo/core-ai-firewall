worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    upstream nexus_api {
        server nexus-api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Cloudflare Tunnel terminates TLS; origin receives HTTP with CF headers.
        set_real_ip_from 172.16.0.0/12;
        real_ip_header CF-Connecting-IP;

        location /v1/shield {
            proxy_pass         http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /v1/shield/validate-chat {
            proxy_pass         http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /healthz {
            proxy_pass http://nexus_api/healthz;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            access_log off;
        }

        location /metrics {
            proxy_pass http://nexus_api/metrics;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location / {
            proxy_pass         http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Connection        "";
        }

        error_page 403 = @security_block;

        location @security_block {
            default_type application/json;
            return 403 '{"status":"REJECTED","reason":"Security Policy Violation - Nexus Quantum Guard","error_code":403}';
        }
    }
}
