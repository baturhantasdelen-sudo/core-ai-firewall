version: "3.8"

networks:
  nexus_network:
    driver: bridge

services:
  # ⚡ Nexus Shield v2.0 — ONLY service on host :8080 (nexus_shield_fast_api:app)
  # Legacy ML pipeline is isolated on :8000 — never bound to 8080.
  nexus-shield-api:
    build:
      context: .
      dockerfile: Dockerfile.fast
    container_name: nexus_shield_app
    ports:
      - "8080:8080"
    volumes:
      - ./nexus_shield_fast_api.py:/app/nexus_shield_fast_api.py:ro
    environment:
      NEXUS_API_KEY: ${NEXUS_API_KEY:-nexus_secret_key_123}
      REDIS_URL: redis://redis:6379/0
    command:
      [
        "uvicorn",
        "nexus_shield_fast_api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--reload",
      ]
    depends_on:
      - redis
    networks:
      - nexus_network
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"
    networks:
      - nexus_network
    restart: always

  # 🛡️ Legacy ML Pipeline — internal :8000 only (NOT exposed on host :8080)
  nexus-api:
    build: .
    container_name: nexus_api_container
    ports:
      - "8000:8000"
    volumes:
      - ./nexus_quantum_guard.py:/app/nexus_quantum_guard.py:ro
      - ./nexus_shield_api.py:/app/nexus_shield_api.py:ro
    environment:
      API_KEY_SECRET: ${API_KEY_SECRET:-nexus-dev-test-key}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "nexus_quantum_guard:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    networks:
      - nexus_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # 🚀 Nginx Gateway — /v1/shield → Fast API :8080
  nginx-gateway:
    image: nginx:alpine
    container_name: nginx_gateway_container
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nexus-shield-api:
        condition: service_healthy
      nexus-api:
        condition: service_healthy
    networks:
      - nexus_network
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_container
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      nexus-api:
        condition: service_healthy
    networks:
      - nexus_network
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana_container
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: nexus-soc
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/nexus-soc-dashboard.json:/var/lib/grafana/dashboards/nexus-soc-dashboard.json:ro
    depends_on:
      - prometheus
    networks:
      - nexus_network
    restart: always

volumes:
  grafana_data:
