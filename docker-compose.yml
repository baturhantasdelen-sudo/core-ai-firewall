version: "3.8"

networks:
  nexus_network:
    driver: bridge

services:
  # 🛡️ 1. Nexus Quantum Guard API
  nexus-api:
    build: .
    container_name: nexus_api_container
    ports:
      - "8000:8000"
    volumes:
      - ./nexus_quantum_guard.py:/app/nexus_quantum_guard.py:ro
      - ./nexus_shield_api.py:/app/nexus_shield_api.py:ro
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "nexus_quantum_guard:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    networks:
      - nexus_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # 🚀 2. Nginx Gateway / Reverse Proxy
  nginx-gateway:
    image: nginx:alpine
    container_name: nginx_gateway_container
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nexus-api:
        condition: service_healthy
    networks:
      - nexus_network
    restart: always

  # 📊 3. Prometheus (Metrik Toplayıcı)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_container
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      nexus-api:
        condition: service_healthy
    networks:
      - nexus_network
    restart: always

  # 🎨 4. Grafana (SOC Dashboard)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana_container
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: nexus-soc
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/nexus-soc-dashboard.json:/var/lib/grafana/dashboards/nexus-soc-dashboard.json:ro
    depends_on:
      - prometheus
    networks:
      - nexus_network
    restart: always

volumes:
  grafana_data:
