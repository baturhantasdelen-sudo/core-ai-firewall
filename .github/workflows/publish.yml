name: Publish Mobile Store Builds

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-android:
    name: Android App Bundle (Play Store)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexusshield_mobile
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CI: true
      GITHUB_ACTIONS: true
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android release keystore
        working-directory: nexusshield_mobile/android/app
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${{ github.workspace }}/nexusshield_mobile/android/app/upload-keystore.jks"
          mkdir -p "$(dirname "$KEYSTORE_FILE")"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_FILE"
            echo "Release keystore written to android/app/upload-keystore.jks from ANDROID_KEYSTORE_BASE64."
          elif [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            cp "$ANDROID_KEYSTORE_PATH" "$KEYSTORE_FILE"
            echo "Release keystore copied from ANDROID_KEYSTORE_PATH to android/app/upload-keystore.jks."
          elif [ -f "$KEYSTORE_FILE" ]; then
            echo "Using existing android/app/upload-keystore.jks on runner."
          else
            echo "::error::Configure ANDROID_KEYSTORE_BASE64 (recommended) or ANDROID_KEYSTORE_PATH."
            exit 1
          fi

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Keystore file is empty. Re-encode ANDROID_KEYSTORE_BASE64 without line breaks."
            exit 1
          fi

          ALIAS="${ANDROID_KEY_ALIAS:-${ANDROID_KEYSTORE_ALIAS:-}}"
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "$ALIAS" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (or ANDROID_KEYSTORE_ALIAS), and ANDROID_KEY_PASSWORD are required."
            exit 1
          fi

          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Keystore alias verified: $ALIAS"

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Verify AAB is release-signed
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/aab-verify.txt
          if grep -qi "CN=Android Debug" /tmp/aab-verify.txt; then
            echo "::error::AAB is debug-signed. Check keystore secrets and Gradle signing config."
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusshield-android-aab-${{ github.ref_name }}
          path: nexusshield_mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: nexusshield_mobile/android

      - name: Install Fastlane (Android)
        working-directory: nexusshield_mobile/android
        run: bundle install

      - name: Configure Google Play service account
        working-directory: nexusshield_mobile/android
        env:
          GOOGLE_PLAY_JSON_KEY_CONTENT: ${{ secrets.GOOGLE_PLAY_JSON_KEY_CONTENT }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY_CONTENT" > fastlane/play-store-key.json

      - name: Deploy to Google Play (Fastlane)
        working-directory: nexusshield_mobile/android
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ github.workspace }}/nexusshield_mobile/android/fastlane/play-store-key.json
          GOOGLE_PLAY_TRACK: internal
        run: bundle exec fastlane deploy

  build-ios:
    name: iOS IPA (App Store Connect)
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/nexusshield_mobile/ios/fastlane/keys/AuthKey.p8
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      CI: true
    steps:
      # (a) Checkout & Flutter setup
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: nexusshield_mobile
        run: flutter pub get

      # (b) Ruby & Fastlane setup
      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: nexusshield_mobile/ios

      - name: Install Fastlane (iOS)
        working-directory: nexusshield_mobile/ios
        run: bundle install

      - name: Configure App Store Connect API key
        working-directory: nexusshield_mobile/ios
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          mkdir -p fastlane/keys
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_KEY" > fastlane/keys/AuthKey.p8

      - name: Validate match and signing secrets
        run: |
          set -euo pipefail
          missing=0
          for var in MATCH_PASSWORD MATCH_GIT_URL FASTLANE_TEAM_ID APP_STORE_CONNECT_API_KEY_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret/env: $var"
              missing=1
            fi
          done
          if [ ! -s "${APP_STORE_CONNECT_API_KEY_PATH}" ]; then
            echo "::error::App Store Connect API key file is missing (APP_STORE_CONNECT_API_KEY_KEY secret)."
            missing=1
          fi
          exit "$missing"

      # (c) CI keychain (required before match / xcodebuild)
      - name: Create and unlock CI keychain
        working-directory: nexusshield_mobile/ios
        run: bundle exec fastlane ci_keychain

      # (d) Fastlane match sign — MUST run before flutter build ipa
      - name: Install code signing (Fastlane match sign)
        working-directory: nexusshield_mobile/ios
        run: bundle exec fastlane sign

      - name: Verify signing assets before IPA build
        working-directory: nexusshield_mobile
        run: |
          set -euo pipefail
          test -f ios/ExportOptions.plist || (echo "::error::ios/ExportOptions.plist missing — fastlane sign must run first." && exit 1)
          security find-identity -v -p codesigning | grep -q "Apple Distribution" || (echo "::error::No Apple Distribution identity in keychain after match." && exit 1)
          echo "ExportOptions.plist and distribution identity OK."

      # (e) Build IPA with match profiles + ExportOptions.plist
      - name: Build release IPA
        working-directory: nexusshield_mobile
        env:
          CODESIGNING_FOLDER_PATH: ${{ github.workspace }}/nexusshield_mobile/ios
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusshield-ios-ipa-${{ github.ref_name }}
          path: nexusshield_mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # (f) App Store Connect deploy
      - name: Deploy to App Store Connect (Fastlane)
        working-directory: nexusshield_mobile/ios
        run: bundle exec fastlane deploy
