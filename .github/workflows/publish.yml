name: Publish Mobile Store Builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android:
    name: Android App Bundle (Play Store)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexusshield_mobile
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusshield-android-aab-${{ github.ref_name }}
          path: nexusshield_mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: nexusshield_mobile/android

      - name: Install Fastlane (Android)
        working-directory: nexusshield_mobile/android
        run: bundle install

      - name: Configure Google Play service account
        working-directory: nexusshield_mobile/android
        env:
          GOOGLE_PLAY_JSON_KEY_CONTENT: ${{ secrets.GOOGLE_PLAY_JSON_KEY_CONTENT }}
        run: |
          printf '%s\n' "$GOOGLE_PLAY_JSON_KEY_CONTENT" > fastlane/play-store-credentials.json

      - name: Deploy to Google Play (Fastlane supply)
        working-directory: nexusshield_mobile/android
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ github.workspace }}/nexusshield_mobile/android/fastlane/play-store-credentials.json
          GOOGLE_PLAY_TRACK: internal
        run: bundle exec fastlane deploy

  build-ios:
    name: iOS IPA (App Store / TestFlight)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nexusshield_mobile
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release IPA
        run: flutter build ipa --release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusshield-ios-ipa-${{ github.ref_name }}
          path: nexusshield_mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: nexusshield_mobile/ios

      - name: Install Fastlane (iOS)
        working-directory: nexusshield_mobile/ios
        run: bundle install

      - name: Configure App Store Connect API key
        working-directory: nexusshield_mobile/ios
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          mkdir -p fastlane/keys
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_KEY" > fastlane/keys/AuthKey.p8

      - name: Deploy to TestFlight (Fastlane pilot)
        working-directory: nexusshield_mobile/ios
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/nexusshield_mobile/ios/fastlane/keys/AuthKey.p8
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
        run: bundle exec fastlane beta
