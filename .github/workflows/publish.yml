name: Publish Mobile Store Builds

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-android:
    name: Android App Bundle (Play Store)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexusshield_mobile
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CI: true
      GITHUB_ACTIONS: true
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android release keystore
        working-directory: nexusshield_mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${{ github.workspace }}/nexusshield_mobile/android/app/upload-keystore.jks"
          KEY_PROPS="${{ github.workspace }}/nexusshield_mobile/android/key.properties"
          mkdir -p "$(dirname "$KEYSTORE_FILE")"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_FILE"
            echo "Keystore decoded to android/app/upload-keystore.jks"
          elif [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            cp "$ANDROID_KEYSTORE_PATH" "$KEYSTORE_FILE"
            echo "Keystore copied to android/app/upload-keystore.jks"
          else
            echo "::error::Set ANDROID_KEYSTORE_BASE64 (recommended) or a valid ANDROID_KEYSTORE_PATH secret."
            exit 1
          fi

          chmod 600 "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Keystore file is empty — regenerate ANDROID_KEYSTORE_BASE64 as single-line base64."
            exit 1
          fi

          ALIAS="${ANDROID_KEYSTORE_ALIAS:-${ANDROID_KEY_ALIAS:-}}"
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "$ALIAS" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD, ANDROID_KEYSTORE_ALIAS (or ANDROID_KEY_ALIAS), ANDROID_KEY_PASSWORD required."
            exit 1
          fi

          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ALIAS"
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ALIAS" | grep -E "Alias name:|Valid from:|Owner:"

          {
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ALIAS}"
            echo "storeFile=${KEYSTORE_FILE}"
          } > "$KEY_PROPS"
          chmod 600 "$KEY_PROPS"

          echo "ANDROID_KEYSTORE_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "NEXUS_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "NEXUS_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: nexusshield_mobile/android

      - name: Install Fastlane (Android)
        working-directory: nexusshield_mobile/android
        run: bundle install

      - name: Configure Google Play service account
        working-directory: nexusshield_mobile/android
        env:
          GOOGLE_PLAY_JSON_KEY_CONTENT: ${{ secrets.GOOGLE_PLAY_JSON_KEY_CONTENT }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY_CONTENT" > fastlane/play-store-key.json

      - name: Resolve Android version code (Play Store)
        id: android_version
        working-directory: nexusshield_mobile/android
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ github.workspace }}/nexusshield_mobile/android/fastlane/play-store-key.json
          GOOGLE_PLAY_TRACK: internal
        run: bundle exec fastlane ci_version_code

      - name: Build release App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ""
        run: |
          set -euo pipefail
          test -f android/key.properties
          test -f "${ANDROID_KEYSTORE_PATH}"
          grep -q "storeFile=" android/key.properties
          BUILD_NUMBER="${{ steps.android_version.outputs.version_code }}"
          if [ -z "$BUILD_NUMBER" ]; then
            echo "::error::android_version step did not produce version_code output."
            exit 1
          fi
          echo "Building with versionCode (build-number): $BUILD_NUMBER"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Verify AAB is release-signed
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/aab-verify.txt
          if grep -qi "CN=Android Debug" /tmp/aab-verify.txt; then
            echo "::error::AAB is debug-signed. Fix keystore secrets before Play upload."
            exit 1
          fi
          if ! grep -qi "jar verified" /tmp/aab-verify.txt; then
            echo "::error::AAB signature verification failed."
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusshield-android-aab-${{ github.ref_name }}
          path: nexusshield_mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to Google Play (Fastlane)
        working-directory: nexusshield_mobile/android
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ github.workspace }}/nexusshield_mobile/android/fastlane/play-store-key.json
          GOOGLE_PLAY_TRACK: internal
        run: bundle exec fastlane deploy

  build-ios:
    name: iOS IPA (App Store Connect)
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_GITHUB_PAT: ${{ secrets.MATCH_GITHUB_PAT }}
      MATCH_KEYCHAIN_NAME: ${{ secrets.MATCH_KEYCHAIN_NAME }}
      MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
      MATCH_GITHUB_PAT_WRITE: ${{ secrets.MATCH_GITHUB_PAT_WRITE }}
      NEXUS_MATCH_DISABLE_BOOTSTRAP: "true"
      NEXUS_MATCH_READONLY: "true"
      CI: true
      GITHUB_ACTIONS: true
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Match git authentication
        run: |
          set -euo pipefail
          if [ -n "${MATCH_GIT_BASIC_AUTHORIZATION:-}" ]; then
            echo "Using MATCH_GIT_BASIC_AUTHORIZATION from secrets (read-only clone)."
            exit 0
          fi
          if echo "${MATCH_GIT_URL:-}" | grep -Eq 'https://[^/@]+@'; then
            echo "MATCH_GIT_URL already contains embedded credentials."
            exit 0
          fi
          PAT="${MATCH_GITHUB_PAT:-}"
          if [ -z "$PAT" ]; then
            echo "::error::Set MATCH_GITHUB_PAT (read access to the private match repo, e.g. nexus-shield-match). Do not rely on GITHUB_TOKEN — it cannot push to external match repos and often causes 403."
            exit 1
          fi
          AUTH=$(printf 'x-access-token:%s' "$PAT" | base64 | tr -d '\n')
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"
          echo "Configured Match git read auth via MATCH_GITHUB_PAT."
          if [ -n "${MATCH_GITHUB_PAT_WRITE:-}" ]; then
            AUTH_WRITE=$(printf 'x-access-token:%s' "$MATCH_GITHUB_PAT_WRITE" | base64 | tr -d '\n')
            echo "MATCH_GIT_BASIC_AUTHORIZATION_WRITE=$AUTH_WRITE" >> "$GITHUB_ENV"
            echo "Configured Match git write auth via MATCH_GITHUB_PAT_WRITE (bootstrap only)."
          fi

      - name: Prepare Match git branch default
        run: |
          if [ -z "${MATCH_GIT_BRANCH:-}" ]; then
            echo "MATCH_GIT_BRANCH=main" >> "$GITHUB_ENV"
            echo "Defaulting MATCH_GIT_BRANCH to main."
          fi

      - name: Prepare Fastlane CI keychain environment
        run: |
          set -euo pipefail
          if [ -z "${MATCH_KEYCHAIN_NAME:-}" ]; then
            echo "MATCH_KEYCHAIN_NAME=nexusshield-ci.keychain-db" >> "$GITHUB_ENV"
          fi
          if [ -z "${MATCH_KEYCHAIN_PASSWORD:-}" ]; then
            echo "MATCH_KEYCHAIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          fi

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: nexusshield_mobile
        run: flutter pub get

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: nexusshield_mobile/ios

      - name: Install Fastlane (iOS)
        working-directory: nexusshield_mobile/ios
        run: bundle install

      - name: Configure App Store Connect API key
        working-directory: nexusshield_mobile/ios
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          mkdir -p fastlane/keys
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_KEY" > fastlane/keys/AuthKey.p8

      - name: Validate match and signing secrets
        run: |
          set -euo pipefail
          missing=0
          for var in MATCH_PASSWORD MATCH_GIT_URL FASTLANE_TEAM_ID APP_STORE_CONNECT_API_KEY_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret/env: $var"
              missing=1
            fi
          done
          if [ -n "${MATCH_GIT_URL:-}" ] && ! echo "$MATCH_GIT_URL" | grep -Eq '^(https://|git@|ssh://)'; then
            echo "::error::MATCH_GIT_URL must start with https://, git@, or ssh://"
            missing=1
          fi
          ASC_KEY_FILE="${GITHUB_WORKSPACE}/nexusshield_mobile/ios/fastlane/keys/AuthKey.p8"
          if [ ! -s "$ASC_KEY_FILE" ]; then
            echo "::error::App Store Connect API key file is missing at $ASC_KEY_FILE (check APP_STORE_CONNECT_API_KEY_KEY secret)."
            missing=1
          fi
          if [ -z "${MATCH_GIT_BASIC_AUTHORIZATION:-}" ] && [ -z "${MATCH_GITHUB_PAT:-}" ] && ! echo "${MATCH_GIT_URL:-}" | grep -Eq 'https://[^/@]+@'; then
            echo "::error::Match git auth missing: set MATCH_GITHUB_PAT or MATCH_GIT_BASIC_AUTHORIZATION, or PAT in MATCH_GIT_URL."
            missing=1
          fi
          echo "MATCH_GIT_URL host: $(echo "$MATCH_GIT_URL" | sed -E 's#^https://([^/@]+@)?([^/]+)/.*#\2#; s#^git@([^:]+):.*#\1#')"
          exit "$missing"

      - name: Sign and build release IPA (Fastlane)
        working-directory: nexusshield_mobile/ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GITHUB_PAT: ${{ secrets.MATCH_GITHUB_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
          MATCH_KEYCHAIN_NAME: ${{ env.MATCH_KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD: ${{ env.MATCH_KEYCHAIN_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          FASTLANE_DISABLE_PROMPTS: "1"
          CI: true
        run: bundle exec fastlane build

      - name: Verify IPA artifact exists
        working-directory: nexusshield_mobile
        run: |
          set -euo pipefail
          ls -la build/ios/ipa/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusshield-ios-ipa-${{ github.ref_name }}
          path: nexusshield_mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to App Store Connect (Fastlane)
        working-directory: nexusshield_mobile/ios
        run: bundle exec fastlane deploy
