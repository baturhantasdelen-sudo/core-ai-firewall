name: CI/CD Pipeline - Build, Push & Deploy

on:
  push:
    branches:
      - main
      - master

env:
  IMAGE_NAME: nexus-quantum-guard
  DEPLOY_PATH: /opt/nexus-core-firewall

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nexus-quantum-guard:latest
            ${{ secrets.DOCKER_USERNAME }}/nexus-quantum-guard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Fast API Image (landing + /v1/shield)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.fast
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nexus-shield-fast:latest
            ${{ secrets.DOCKER_USERNAME }}/nexus-shield-fast:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync production configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx.conf,index.html,deploy/nginx/nexus-shield.conf,Dockerfile.fast,nexus_shield_fast_api.py,requirements-fast.txt"
          target: /opt/nexus-core-firewall/

      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/nexus-quantum-guard:${{ github.sha }}
          DOCKER_FAST_IMAGE: ${{ secrets.DOCKER_USERNAME }}/nexus-shield-fast:${{ github.sha }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_IMAGE,DOCKER_FAST_IMAGE,API_KEY_SECRET
          script: |
            set -euo pipefail
            cd /opt/nexus-core-firewall
            echo "DOCKER_IMAGE=${DOCKER_IMAGE}" > .env
            echo "DOCKER_FAST_IMAGE=${DOCKER_FAST_IMAGE}" >> .env
            echo "NEXUS_API_KEY=${API_KEY_SECRET}" >> .env
            echo "RATE_LIMIT_REQUESTS=60" >> .env
            echo "RATE_LIMIT_WINDOW_SECONDS=60" >> .env
            echo "${DOCKER_PASSWORD}" | sudo docker login -u "${DOCKER_USERNAME}" --password-stdin
            sudo docker compose --env-file .env -f docker-compose.prod.yml pull nexus-api nexus-shield-api || true
            sudo docker compose --env-file .env -f docker-compose.prod.yml up -d --build --remove-orphans
            sudo docker compose --env-file .env -f docker-compose.prod.yml restart nginx-gateway
            curl -fsS http://127.0.0.1:80/ | grep -q "Nexus Shield" || (echo "Landing page check failed on :80" && exit 1)
            curl -fsS http://127.0.0.1:8080/ | grep -q "Nexus Shield" || (echo "Landing page check failed on :8080" && exit 1)
            sudo docker image prune -f
            echo "Deploy tamamlandi: ${DOCKER_IMAGE} + ${DOCKER_FAST_IMAGE}"
