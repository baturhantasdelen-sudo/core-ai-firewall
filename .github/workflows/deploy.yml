name: Nexus Quantum Guard — Build & Deploy

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: nexus-quantum-guard
  DEPLOY_PATH: /opt/nexus-core-firewall

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCP Production (SSH)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH deploy key
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$PROD_SERVER_IP" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          echo "Deploy key fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/deploy_key"
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${PROD_SERVER_USER}@${PROD_SERVER_IP}" "echo SSH_OK"

      - name: Prepare deploy directory on server
        env:
          PROD_SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${PROD_SERVER_USER}@${PROD_SERVER_IP}" bash -s <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="/opt/nexus-core-firewall"
          sudo mkdir -p "$DEPLOY_PATH"
          sudo chown -R "$USER:$USER" "$DEPLOY_PATH"
          chmod 775 "$DEPLOY_PATH"
          if ! swapon --show | grep -q /swapfile; then
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          ls -la "$DEPLOY_PATH"
          REMOTE

      - name: Sync production configs to server (SCP)
        env:
          PROD_SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml nginx.conf \
            "${PROD_SERVER_USER}@${PROD_SERVER_IP}:/opt/nexus-core-firewall/"

      - name: Deploy via SSH
        env:
          PROD_SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/nexus-quantum-guard:${{ github.sha }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          PASS_B64=$(printf '%s' "$DOCKER_PASSWORD" | base64 -w0)
          TUNNEL_B64=$(printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" | base64 -w0)
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${PROD_SERVER_USER}@${PROD_SERVER_IP}" bash -s <<REMOTE
          set -euo pipefail
          export DOCKER_USERNAME="$DOCKER_USERNAME"
          export DOCKER_IMAGE="$DOCKER_IMAGE"
          DEPLOY_PATH="/opt/nexus-core-firewall"
          mkdir -p "\$DEPLOY_PATH"
          cd "\$DEPLOY_PATH"
          printf 'DOCKER_IMAGE=%s\n' "\$DOCKER_IMAGE" > .env
          printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$(echo "$TUNNEL_B64" | base64 -d)" >> .env

          for f in docker-compose.prod.yml nginx.conf; do
            if [[ ! -f "\$f" ]]; then
              echo "HATA: \$DEPLOY_PATH/\$f SCP sonrasi bulunamadi."
              exit 1
            fi
          done

          echo "$PASS_B64" | base64 -d | docker login -u "\$DOCKER_USERNAME" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          echo "Deploy tamamlandi: \$DOCKER_IMAGE"
          REMOTE
