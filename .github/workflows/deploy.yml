name: CI - Nexus Shield Mobile

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  mobile-analyze-test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexusshield_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify mobile feature layout
        run: |
          set -euo pipefail
          for dir in \
            lib/domain \
            lib/features/dashboard \
            lib/features/permissions \
            lib/features/ai_shield \
            lib/features/network \
            lib/features/call_fraud \
            lib/features/remote_access \
            lib/core/platform
          do
            test -d "$dir" || { echo "Missing required path: $dir"; exit 1; }
          done
          echo "Mobile architecture directories OK"

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter test
        run: flutter test

  mobile-android-compile:
    name: Android compile (debug)
    runs-on: ubuntu-latest
    needs: mobile-analyze-test
    defaults:
      run:
        working-directory: nexusshield_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK (debug, no store signing)
        run: |
          flutter pub get
          flutter build apk --debug
