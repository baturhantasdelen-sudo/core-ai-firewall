name: Nexus Quantum Guard — Build & Deploy

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: nexus-quantum-guard
  DEPLOY_PATH: /opt/nexus-core-firewall

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCP Production (SSH)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync production configs to server (SCP)
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx.conf"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -euo pipefail
            export DOCKER_IMAGE="${{ secrets.DOCKER_USERNAME }}/nexus-quantum-guard:${{ github.sha }}"
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            for f in docker-compose.prod.yml nginx.conf; do
              if [[ ! -f "$f" ]]; then
                echo "HATA: $DEPLOY_PATH/$f SCP sonrasi bulunamadi."
                exit 1
              fi
            done

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            echo "Deploy tamamlandi: $DOCKER_IMAGE"
