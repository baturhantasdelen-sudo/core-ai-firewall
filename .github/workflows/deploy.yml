name: CI/CD Pipeline - Build, Push & Deploy

on:
  push:
    branches:
      - main
      - master

env:
  IMAGE_NAME: nexus-quantum-guard
  DEPLOY_PATH: /opt/nexus-core-firewall

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nexus-quantum-guard:latest
            ${{ secrets.DOCKER_USERNAME }}/nexus-quantum-guard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync production configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx.conf"
          target: /opt/nexus-core-firewall/

      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/nexus-quantum-guard:${{ github.sha }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_IMAGE,API_KEY_SECRET,CLOUDFLARE_TUNNEL_TOKEN
          script: |
            set -euo pipefail
            cd /opt/nexus-core-firewall

            printf 'DOCKER_IMAGE=%s\n' "$DOCKER_IMAGE" > .env
            if [ -n "${API_KEY_SECRET:-}" ]; then
              printf 'NEXUS_API_KEY=%s\n' "$API_KEY_SECRET" >> .env
            else
              echo "HATA: API_KEY_SECRET bos; NEXUS_API_KEY yazilamadi."
              exit 1
            fi
            printf 'RATE_LIMIT_REQUESTS=%s\n' "${RATE_LIMIT_REQUESTS:-60}" >> .env
            printf 'RATE_LIMIT_WINDOW_SECONDS=%s\n' "${RATE_LIMIT_WINDOW_SECONDS:-60}" >> .env
            if [ -n "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
              printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$CLOUDFLARE_TUNNEL_TOKEN" >> .env
            fi

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker compose --env-file .env -f docker-compose.prod.yml pull nexus-api
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "Deploy tamamlandi: $DOCKER_IMAGE"
