name: Nexus Shield v2.0 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  nexus-shield-v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-fast.txt -r requirements-ci.txt
          pip install pytest httpx

      - name: Start Docker Compose (Redis + FastAPI v2.0)
        env:
          NEXUS_API_KEY: nexus_secret_key_123
        run: |
          docker compose -f docker-compose.fast.yml up -d --build --wait
          docker compose -f docker-compose.fast.yml ps

      - name: Wait for FastAPI healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q HEALTHY; then
              echo "Nexus Shield v2.0 is healthy on :8080"
              curl -fsS http://127.0.0.1:8080/healthz
              exit 0
            fi
            sleep 2
          done
          echo "FastAPI failed to become healthy"
          docker compose -f docker-compose.fast.yml logs nexus-shield-api
          exit 1

      - name: Run Nexus Shield v2.0 PyTest suite (live :8080)
        env:
          NEXUS_SHIELD_BASE_URL: http://127.0.0.1:8080
          NEXUS_API_KEY: nexus_secret_key_123
          NEXUS_SHIELD_SLA_MS: "10"
        run: |
          python -m pytest tests/test_nexus_shield.py -v --tb=short

      - name: Run legacy unit tests (in-process, no live server required)
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/locustfile.py \
            --ignore=tests/test_nexus_shield.py

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-shield-api-logs
          path: |
            docker-compose.fast.yml
          if-no-files-found: ignore

      - name: Collect container logs
        if: failure()
        run: docker compose -f docker-compose.fast.yml logs > compose-logs.txt || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore

      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f docker-compose.fast.yml down -v
