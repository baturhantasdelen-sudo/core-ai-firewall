# Nexus Shield Fast API + Redis — local / load-test stack
# Usage: ./scripts/start-fast-stack.sh  OR  .\scripts\start-fast-stack.ps1
# Dashboard: http://localhost:8080/dashboard

version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"
    restart: always

  nexus-shield-api:
    build:
      context: .
      dockerfile: Dockerfile.fast
    container_name: nexus_shield_app
    # Explicit: host 8080 → nexus_shield_fast_api only (see docker-compose.yml)
    ports:
      - "8080:8080"
    volumes:
      - ./nexus_shield_fast_api.py:/app/nexus_shield_fast_api.py:ro
    environment:
      - NEXUS_API_KEY=${NEXUS_API_KEY:-nexus_secret_key_123}
      - REDIS_URL=redis://redis:6379/0
    command:
      [
        "uvicorn",
        "nexus_shield_fast_api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--reload",
      ]
    depends_on:
      - redis
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
