# Zero-rewrite MCP — policy sidecar + gateway + mock MCP + sample agent
# From repo root:
#   docker compose -f examples/zero-rewrite-mcp/docker-compose.yml up --build

name: zero-rewrite-mcp

networks:
  zrm_net:
    driver: bridge

services:
  mock-mcp:
    image: python:3.12-slim
    container_name: zrm_mock_mcp
    working_dir: /app/examples/zero-rewrite-mcp
    command: ["python", "mock_mcp_server.py"]
    volumes:
      - ../..:/app:ro
    networks:
      - zrm_net

  policy-sidecar:
    image: python:3.12-slim
    container_name: zrm_policy_sidecar
    working_dir: /app/examples/zero-rewrite-mcp
    environment:
      POLICY_FILE: /app/examples/zero-rewrite-mcp/policy.yaml
      BIND_PORT: "8091"
    command: ["sh", "-c", "pip install -q pyyaml && python policy_sidecar.py"]
    volumes:
      - ../..:/app:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - zrm_net

  mcp-gateway:
    image: python:3.12-slim
    container_name: zrm_mcp_gateway
    working_dir: /app/examples/zero-rewrite-mcp
    depends_on:
      policy-sidecar:
        condition: service_healthy
      mock-mcp:
        condition: service_started
    environment:
      NEXUS_INTERCEPT_URL: http://policy-sidecar:8091/v1/intercept
      UPSTREAM_MCP_URL: http://mock-mcp:8100
      GATEWAY_PORT: "8200"
    command: ["python", "mcp_gateway.py"]
    ports:
      - "8200:8200"
    volumes:
      - ../..:/app:ro
    networks:
      - zrm_net

  sample-agent:
    image: python:3.12-slim
    container_name: zrm_sample_agent
    working_dir: /app/examples/zero-rewrite-mcp
    depends_on:
      mcp-gateway:
        condition: service_started
    environment:
      MCP_SERVER_URL: http://mcp-gateway:8200
    command: ["python", "agent_client.py"]
    volumes:
      - ../..:/app:ro
    networks:
      - zrm_net
