{{- if and .Values.apiKey.create (not .Values.apiKey.existingSecret) (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apiKey.secretName }}
  labels:
    {{- include "nexus-shield.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKey.secretKey }}: {{ required "apiKey.value is required when apiKey.create=true (use --set-file apiKey.value=...) or set apiKey.existingSecret / externalSecrets" .Values.apiKey.value | quote }}
{{- end }}
---
{{- if .Values.externalSecrets.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "nexus-shield.fullname" . }}-api-key
  labels:
    {{- include "nexus-shield.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "nexus-shield.apiSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.apiKey.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRef.key }}
        property: {{ .Values.externalSecrets.remoteRef.property }}
{{- end }}
