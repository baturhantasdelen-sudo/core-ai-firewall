apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus-shield.fullname" . }}-fast
  labels:
    {{- include "nexus-shield.labels" . | nindent 4 }}
    app.kubernetes.io/component: fast-api
spec:
  type: {{ .Values.fastApi.service.type }}
  ports:
    - port: {{ .Values.fastApi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nexus-shield.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: fast-api
---
{{- if .Values.ml.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus-shield.fullname" . }}-ml
  labels:
    {{- include "nexus-shield.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ml.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nexus-shield.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ml-api
{{- end }}
---
{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus-shield.fullname" . }}-nginx
  labels:
    {{- include "nexus-shield.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "nexus-shield.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
{{- end }}
