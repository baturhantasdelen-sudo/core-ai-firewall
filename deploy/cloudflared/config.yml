# Cloudflare Tunnel — local config (token modunda ingress Cloudflare panelinden gelir)
# Systemd kurulumu: /etc/cloudflared/config.yml
#
# KRITIK: Origin MUTLAKA Nginx Gateway olmali — ASLA :8000 (nexus_quantum_guard) degil.
# Nginx :80 -> / = Vercel UI, /api/* = ML API :8000, /v1/shield = Fast API :8080

tunnel: ${TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json

# Allow cloudflared to auto-update; reconnect after transient network drops.
no-autoupdate: false
retries: 5
grace-period: 30s

ingress:
  - hostname: api.nexusshield.ai
    service: http://127.0.0.1:80
  - hostname: nexusshield.ai
    service: http://127.0.0.1:80
  - service: http_status:404
