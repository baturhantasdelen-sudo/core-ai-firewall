# Nexus Shield v2.0 — host nginx (api.nexusshield.ai)
#
# Kurulum:
#   sudo cp deploy/nginx/nexus-shield.conf /etc/nginx/sites-available/nexus-shield
#   sudo ln -s /etc/nginx/sites-available/nexus-shield /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl restart nginx
#
# SSL (Let's Encrypt):
#   sudo certbot --nginx -d api.nexusshield.ai
#
# Backend: nexus-shield-api container (Dockerfile.fast) on host port 8080
#   docker compose -f docker-compose.prod.yml up -d nexus-shield-api

upstream nexus_shield_fast {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP → HTTPS (certbot sonrası aktif)
server {
    listen 80;
    server_name api.nexusshield.ai nexusshield.ai;

    location / {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

