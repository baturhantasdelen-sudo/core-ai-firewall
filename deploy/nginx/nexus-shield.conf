# Nexus Shield — Unified domain (api.nexusshield.ai)
#
# Routing:
#   /              -> Vercel Next.js (nexus-shield-dashboard.vercel.app)
#   /api/health    -> Python ML API (:8000)
#   /api/*         -> Python ML API (:8000)
#   /api/sandbox   -> Fast Guardrail API (:8080)
#   /api/v1/health -> Fast Guardrail API (:8080)
#   /v1/shield     -> Fast Guardrail API (:8080)
#   /v1/agent      -> Fast Guardrail API (:8080)
#
# Install (host nginx — only if Docker nginx-gateway is NOT binding :80):
#   sudo cp deploy/nginx/nexus-shield.conf /etc/nginx/sites-available/nexus-shield
#   sudo ln -sf /etc/nginx/sites-available/nexus-shield /etc/nginx/sites-enabled/nexus-shield
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Production (Docker): nginx.conf is mounted by nginx-gateway container on :80.
# Cloudflare Tunnel origin MUST be http://127.0.0.1:80 (NOT :8000 or :8080).

upstream nexus_shield_fast {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream nexus_ml_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name api.nexusshield.ai nexusshield.ai;

    # ── Fast Guardrail API (:8080) ────────────────────────────────────────────

    location /v1/shield/validate-chat {
        proxy_pass http://nexus_ml_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /v1/agent {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /v1/mcp {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /v1/shield {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/sandbox {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/v1/health {
        proxy_pass http://nexus_shield_fast/api/v1/health;
        access_log off;
    }

    location /ws/analytics {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /healthz {
        proxy_pass http://nexus_shield_fast/healthz;
        access_log off;
    }

    # ── Python ML API (:8000) — /api/* backend ────────────────────────────────

    location /api/health {
        proxy_pass http://nexus_ml_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/ {
        proxy_pass http://nexus_ml_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /metrics {
        proxy_pass http://nexus_ml_api/metrics;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # ── Frontend (Vercel Next.js) — root / ────────────────────────────────────

    location / {
        proxy_pass https://nexus-shield-dashboard.vercel.app;
        proxy_ssl_server_name on;
        proxy_ssl_session_reuse off;
        proxy_http_version 1.1;
        proxy_set_header Host nexus-shield-dashboard.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }
}
