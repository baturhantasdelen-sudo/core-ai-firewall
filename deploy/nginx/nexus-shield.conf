# Nexus Shield v2.0 — host nginx (api.nexusshield.ai)
#
# Kurulum:
#   sudo cp deploy/nginx/nexus-shield.conf /etc/nginx/sites-available/nexus-shield
#   sudo ln -s /etc/nginx/sites-available/nexus-shield /etc/nginx/sites-enabled/
#   sudo cp index.html /opt/nexus-core-firewall/index.html
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: sudo certbot --nginx -d api.nexusshield.ai

upstream nexus_shield_fast {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name api.nexusshield.ai nexusshield.ai;

    # Kök / → statik landing (index.html)
    location = / {
        root /opt/nexus-core-firewall;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location /v1/shield {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /dashboard {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location /ws/analytics {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /healthz {
        proxy_pass http://nexus_shield_fast/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
