# Nexus Shield v2.0 — host nginx (api.nexusshield.ai)
#
# Hybrid routing:
#   FastAPI  → /v1/shield, /api/sandbox, /healthz, /metrics
#   Vercel   → / (All-in-One Next.js landing + dashboard + Stripe)
#
# Kurulum:
#   sudo cp deploy/nginx/nexus-shield.conf /etc/nginx/sites-available/nexus-shield
#   sudo ln -s /etc/nginx/sites-available/nexus-shield /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: sudo certbot --nginx -d api.nexusshield.ai

upstream nexus_shield_fast {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream nexus_ml_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name api.nexusshield.ai nexusshield.ai;

    # ── FastAPI routes ────────────────────────────────────────────────────────

    location /v1/shield/validate-chat {
        proxy_pass http://nexus_ml_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /v1/agent {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /v1/mcp {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /v1/shield {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/sandbox {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /ws/analytics {
        proxy_pass http://nexus_shield_fast;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /healthz {
        proxy_pass http://nexus_shield_fast/healthz;
        access_log off;
    }

    location /api/v1/health {
        proxy_pass http://nexus_shield_fast/api/v1/health;
        access_log off;
    }

    location /metrics {
        proxy_pass http://nexus_ml_api/metrics;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # ── Vercel All-in-One Next.js app ─────────────────────────────────────────

    location / {
        proxy_pass https://nexus-shield-dashboard.vercel.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host nexus-shield-dashboard.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
