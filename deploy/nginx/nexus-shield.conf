# Nexus Shield v2.0 — host nginx (minimal)
#
# Kurulum:
#   sudo cp deploy/nginx/nexus-shield.conf /etc/nginx/sites-available/nexus-shield
#   sudo ln -s /etc/nginx/sites-available/nexus-shield /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl restart nginx
#
# SSL (Let's Encrypt):
#   sudo certbot --nginx -d api.nexusshield.ai

server {
    listen 80;
    server_name api.nexusshield.ai;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
