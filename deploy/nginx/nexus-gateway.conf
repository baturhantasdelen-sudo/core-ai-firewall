# /etc/nginx/sites-available/nexus-gateway.conf
# Nexus Quantum Guard — Kurumsal AI Gateway (TLS + Prompt Injection Koruması)
#
# Gereksinimler:
#   apt install nginx-module-njs
#   /etc/nginx/njs/shield_auth.js  →  deploy/nginx/shield_auth.js kopyası
#
# Symlink: ln -s /etc/nginx/sites-available/nexus-gateway.conf /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl reload nginx

load_module modules/ngx_http_js_module.so;

js_import shield from /etc/nginx/njs/shield_auth.js;

upstream quantum_guard_backend {
    server 127.0.0.1:8000;   # Docker: nexus-quantum-guard:v1.0.0
    keepalive 16;
}

upstream corporate_llm_backend {
    server 10.0.1.50:8080;   # Şirket içi ana LLM sunucusu
    keepalive 32;
}

# İstemci gövdesini okuyabilmek için (chat/completions JSON)
client_max_body_size 10m;
client_body_buffer_size 128k;

server {
    listen 443 ssl http2;
    server_name ai-gateway.kurum.yerel;

    ssl_certificate     /etc/ssl/certs/kurum_gateway.crt;
    ssl_certificate_key /etc/ssl/private/kurum_gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Ana LLM uç noktası (OpenAI uyumlu) ---
    location /v1/chat/completions {
        # njs: POST gövdesini Quantum Guard'a ilet, 403 ise LLM'e gitme
        js_access shield.shieldAuth;

        proxy_pass         http://corporate_llm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_set_header   Connection        "";

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # --- Gizli iç uç nokta: OpenAI gövdesini validate-chat'e yönlendir ---
    location = /_internal_shield_validate {
        internal;
        proxy_pass              http://quantum_guard_backend/v1/shield/validate-chat;
        proxy_pass_request_body on;
        proxy_set_header        Content-Type  $http_content_type;
        proxy_set_header        X-Request-Id  $request_id;
        proxy_set_header        X-Session-Id  $request_id;
        proxy_http_version      1.1;
        proxy_set_header        Connection    "";
    }

    # --- Quantum Guard doğrudan erişim (opsiyonel, yalnızca iç ağ) ---
    location /v1/shield {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny  all;

        proxy_pass         http://quantum_guard_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Request-Id      $request_id;
    }

    # --- Gateway sağlık kontrolü ---
    location = /healthz {
        proxy_pass http://quantum_guard_backend/healthz;
        access_log off;
    }

    # --- Özelleştirilmiş 403 (js_access dışı hatalar için yedek) ---
    error_page 403 = @security_block;

    location @security_block {
        default_type application/json;
        return 403 '{"status":"REJECTED","reason":"Security Policy Violation - Nexus Quantum Guard","error_code":403}';
    }
}

# HTTP → HTTPS yönlendirme
server {
    listen 80;
    server_name ai-gateway.kurum.yerel;
    return 301 https://$host$request_uri;
}

# =============================================================================
# NOT: auth_request ile validate_prompt (GET alt istek, gövde iletilmez)
# =============================================================================
# Aşağıdaki auth_request yaklaşımı POST gövdesini Quantum Guard'a iletemez.
# OpenAI chat/completions entegrasyonu için yukarıdaki njs + validate-chat kullanın.
#
# location = /validate_prompt {
#     internal;
#     proxy_pass http://quantum_guard_backend/v1/shield;
#     ...
# }
