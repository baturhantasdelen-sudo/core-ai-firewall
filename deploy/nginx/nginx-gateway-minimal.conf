# Minimal Docker nginx gateway (legacy stack: nginx_gateway_container + nexus_shield_app)
# Mount as /etc/nginx/nginx.conf in nginx_gateway_container.
#
# Apply on GCP:
#   sudo cp deploy/nginx/nginx-gateway-minimal.conf /opt/nexus-core-firewall/nginx.conf
#   docker restart nginx_gateway_container

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost api.nexusshield.ai 127.0.0.1;

        # OpenAPI / Swagger — exact + ^~ before Vercel catch-all
        location = /openapi.json {
            proxy_pass http://nexus_shield_app:8080/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location = /openapi.json/ {
            proxy_pass http://nexus_shield_app:8080/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location ^~ /docs {
            proxy_pass http://nexus_shield_app:8080/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location ^~ /redoc {
            proxy_pass http://nexus_shield_app:8080/redoc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /healthz {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location /v1/ {
            proxy_pass http://nexus_shield_app:8080/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/governance/ {
            proxy_pass http://nexus_shield_app:8080/v1/governance/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/proof-center {
            proxy_pass http://nexus_shield_app:8080/api/proof-center;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass https://nexus-shield-dashboard.vercel.app/;
            proxy_set_header Host nexus-shield-dashboard.vercel.app;
            proxy_ssl_server_name on;
        }
    }
}
