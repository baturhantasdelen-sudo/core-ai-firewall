version: "3.8"

services:
  nexus-shield-proxy:
    image: python:3.11-slim
    command: >
      sh -c "pip install --no-cache-dir nexus-shield-cli &&
      nexus-shield proxy --host 0.0.0.0 -p 8080
      -t $${NEXUS_UPSTREAM_TARGET:-https://api.openai.com/v1} --mask-all"
    ports:
      - "${NEXUS_PROXY_PORT:-8080}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      NEXUS_UPSTREAM_TARGET: ${NEXUS_UPSTREAM_TARGET:-https://api.openai.com/v1}
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
