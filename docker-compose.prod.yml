# Production stack — image CI'da build edilir; sunucuda yalnizca pull + up.
# HTTPS: Cloudflare Tunnel (cloudflared) -> nginx-gateway:80 -> nexus-api:8000
# DOCKER_IMAGE ve CLOUDFLARE_TUNNEL_TOKEN .env dosyasinda (GitHub Actions deploy).

networks:
  nexus_network:
    driver: bridge

services:
  nexus-api:
    image: ${DOCKER_IMAGE:?DOCKER_IMAGE environment variable is required}
    container_name: nexus-api-prod
    environment:
      ENV: production
      PYTHONIOENCODING: utf-8
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "nexus_quantum_guard:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: nginx-gateway-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nexus-api:
        condition: service_started
    networks:
      - nexus_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared-prod
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      nginx-gateway:
        condition: service_started
    networks:
      - nexus_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
