version: "3.8"

networks:
  nexus_network:
    driver: bridge

services:
  nexus-api:
    build: .
    image: ${DOCKER_IMAGE:?DOCKER_IMAGE environment variable is required}
    container_name: nexus-api-prod
    environment:
      - ENV=production
      - PYTHONIOENCODING=utf-8
    # Canlı ortamda çoklu iş parçacığı (workers) ile ayağa kaldırıyoruz
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "nexus_quantum_guard:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
      ]
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: always

  nginx-gateway:
    image: nginx:alpine
    container_name: nginx-gateway-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nexus-api:
        condition: service_healthy
    networks:
      - nexus_network
    restart: always
