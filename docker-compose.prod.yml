# Production stack — image CI'da build edilir; sunucuda pull + up.
# HTTPS: Cloudflare Tunnel (cloudflared) -> nginx-gateway:80 -> FastAPI (/v1/shield, /api/sandbox) + Vercel (/)
#
# .env (GitHub Actions tarafindan yazilir):
#   DOCKER_FAST_IMAGE=nexus-shield-fast:local   (varsayilan: yerel build)
#   DEPLOY_ML_IMAGE=0                             (1 = PyTorch ML imaji da cek/kur)
#   DOCKER_IMAGE=<user>/nexus-quantum-guard:<sha> (yalniz DEPLOY_ML_IMAGE=1)
#   NEXUS_API_KEY=<API_KEY_SECRET secret degerinden map edilir>
#   CLOUDFLARE_TUNNEL_TOKEN=<opsiyonel>
#   POSTHOG_API_KEY=<opsiyonel>
#   CLOUDFLARE_WEB_ANALYTICS_TOKEN=<opsiyonel>

networks:
  nexus_network:
    name: nexus_prod_network
    driver: bridge

services:
  nexus-api:
    profiles: ["ml"]
    image: ${DOCKER_IMAGE:-nexus-quantum-guard:local}
    container_name: nexus-api-prod
    hostname: nexus-api-prod
    environment:
      ENV: production
      PYTHONIOENCODING: utf-8
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      NEXUS_SKIP_STARTUP_WARMUP: ${NEXUS_SKIP_STARTUP_WARMUP:-1}
      NEXUS_API_KEY: ${NEXUS_API_KEY:?NEXUS_API_KEY environment variable is required}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    command:
      [
        "uvicorn",
        "nexus_shield_api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]
    networks:
      nexus_network:
        aliases:
          - nexus-api
          - nexus-api-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 900s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ⚡ Nexus Shield v2.0 Fast API — /v1/shield, /dashboard (landing also on :8080)
  nexus-shield-api:
    image: ${DOCKER_FAST_IMAGE:-nexus-shield-fast:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.fast
    container_name: nexus-shield-api-prod
    hostname: nexus-shield-api-prod
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NEXUS_API_KEY: ${NEXUS_API_KEY:?NEXUS_API_KEY environment variable is required}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${CLOUDFLARE_WEB_ANALYTICS_TOKEN:-}
      PROOF_CENTER_BENCHMARK_JSON: ${PROOF_CENTER_BENCHMARK_JSON:-/app/data/proof_center_benchmark.json}
      PROOF_CENTER_BASE_URL: ${PROOF_CENTER_BASE_URL:-http://127.0.0.1:8080}
    command:
      [
        "uvicorn",
        "nexus_shield_fast_api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]
    volumes:
      - ./data:/app/data
      - ./index.html:/app/index.html:ro
      - ./config:/app/config:ro
      - ./nexus_governance:/app/nexus_governance:ro
      - ./nexus_shield_fast_api.py:/app/nexus_shield_fast_api.py:ro
      - ./nexus_observability.py:/app/nexus_observability.py:ro
      - ./nexus_auth.py:/app/nexus_auth.py:ro
    networks:
      nexus_network:
        aliases:
          - nexus-shield-api
          - nexus-shield-api-prod
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: nginx-gateway-prod
    hostname: nginx-gateway-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      nexus-shield-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      nexus_network:
        aliases:
          - nginx-gateway
          - nginx-gateway-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared-prod
    profiles: ["cloudflare"]
    # Host network reaches localhost:80 where nginx-gateway publishes port 80.
    # Cloudflare Zero Trust Public Hostname must use http://127.0.0.1:80 as origin.
    network_mode: host
    command: tunnel run --retries 5
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      nginx-gateway:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
