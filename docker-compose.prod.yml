# Production stack — image CI'da build edilir; sunucuda pull + up.
# HTTPS: Cloudflare Tunnel (cloudflared) -> nginx-gateway:80 -> nexus-shield-api:8080 + index.html
#
# .env (GitHub Actions tarafindan yazilir):
#   DOCKER_IMAGE=<user>/nexus-quantum-guard:<sha>
#   NEXUS_API_KEY=<API_KEY_SECRET secret degerinden map edilir>
#   CLOUDFLARE_TUNNEL_TOKEN=<opsiyonel>
#   POSTHOG_API_KEY=<opsiyonel>
#   CLOUDFLARE_WEB_ANALYTICS_TOKEN=<opsiyonel>

networks:
  nexus_network:
    driver: bridge

services:
  nexus-api:
    image: ${DOCKER_IMAGE:?DOCKER_IMAGE environment variable is required}
    container_name: nexus-api-prod
    environment:
      ENV: production
      PYTHONIOENCODING: utf-8
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      NEXUS_API_KEY: ${NEXUS_API_KEY:?NEXUS_API_KEY environment variable is required}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "nexus_quantum_guard:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ⚡ Nexus Shield v2.0 Fast API — /v1/shield, /dashboard (landing also on :8080)
  nexus-shield-api:
    image: ${DOCKER_FAST_IMAGE:-nexus-shield-fast:local}
    build:
      context: .
      dockerfile: Dockerfile.fast
    container_name: nexus-shield-api-prod
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NEXUS_API_KEY: ${NEXUS_API_KEY:?NEXUS_API_KEY environment variable is required}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${CLOUDFLARE_WEB_ANALYTICS_TOKEN:-}
    volumes:
      - ./data:/app/data
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: nginx-gateway-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      nexus-api:
        condition: service_started
      nexus-shield-api:
        condition: service_healthy
    networks:
      - nexus_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared-prod
    profiles: ["cloudflare"]
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      nginx-gateway:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
